[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-openenv"
version = "1.0.0"
description = "Multi-task OpenEnv evaluation suite (Email Triage, Data Cleaning, Customer Support)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openenv-core[core]>=0.2.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.25.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[project.scripts]
# Server entry point - enables: uv run server
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["env", "server"]
package-dir = { "env" = "env", "server" = "server" }

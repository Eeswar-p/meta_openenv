[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "meta-openenv"
version = "1.0.0"
description = "Multi-task OpenEnv evaluation suite (Email Triage, Data Cleaning, Customer Support)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["env*"]

[project.scripts]
run-inference = "inference:__main__"
